<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便签</title>
    <style>
        /* CSS 样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .note-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="note-container">
        <h1>我的便签</h1>
        <textarea id="note" placeholder="在这里写下你的便签..."></textarea>
        <button onclick="saveNote()">保存便签</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-database.js"></script>
    <script>
        // Firebase 配置信息
        const firebaseConfig = {
            apiKey: "AIzaSyAi_-AsNZNGqaJp7k1agIQpnK002mEfPM8",
            authDomain: "my-notes-fb00d.firebaseapp.com",
            projectId: "my-notes-fb00d",
            storageBucket: "my-notes-fb00d.firebasestorage.app",
            messagingSenderId: "973551354109",
            appId: "1:973551354109:web:6f58f71a21d10c3b62be94",
            measurementId: "G-1JL951WZTR"
        };

        // 初始化 Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database(); // 使用 Firebase 实时数据库

        // 保存便签内容到 Firebase
        function saveNote() {
            const note = document.getElementById('note').value;
            const noteRef = database.ref('notes/user1'); // 假设你使用 'user1' 作为用户ID
            noteRef.set(note);  // 保存便签内容
        }

        // 页面加载时，读取便签内容
        window.onload = function() {
            const noteRef = database.ref('notes/user1');
            noteRef.on('value', function(snapshot) {
                const savedNote = snapshot.val();
                if (savedNote) {
                    document.getElementById('note').value = savedNote;  // 显示已保存的便签
                }
            });
        }
    </script>
</body>
</html>
